<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>{{ page.title | escape }} | {{ site.title | escape }}</title>
<meta http-equiv="Content-Language" content="en-us" >
<!--
   __  ______    __      __            
  / / / /  _/___/ /___ _/ /_  ____     
 / / / // // __  / __ `/ __ \/ __ \    
/ /_/ // // /_/ / /_/ / / / / /_/ /    
\____/___/\__,_/\__,_/_/ /_/\____/     
    __    _ __                         
   / /   (_) /_  _________ ________  __
  / /   / / __ \/ ___/ __ `/ ___/ / / /
 / /___/ / /_/ / /  / /_/ / /  / /_/ / 
/_____/_/_.___/_/   \__,_/_/   \__, /  
                              /____/  

-->
{% unless page.noindex == true or layout.noindex == true %}
<meta name="keywords" content="{{ site.keywords }}" >
<meta name="description" content="{{ site.description }}">
<!-- Open Graph meta -->
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}" />
<meta property="og:site_name" content="{{ site.title | escape }}" />
<meta property="og:description" content="{{ site.description | escape }}" />
<meta property="og:type" content="website" />
<meta property="og:image" content="{{ site.featured-image | absolute_url }}" />
<meta property="og:image:alt" content="{{ site.featured-image-alt | escape }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:locale" content="en_US" />
<!-- schema.org JSON-LD -->
<script type="application/ld+json">{ "@context":"http://schema.org", "@type":"WebPage", "headline": "{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}", "image": "{{ site.featured-image | absolute_url }}", "url": {{ page.url | absolute_url | jsonify }} }</script> 
{% else %}
<meta name="robots" content="noindex" />
{% endunless %}

<link rel="stylesheet" href="{{ '/assets/main-web/bootstrap-uidaho.css' | relative_url }}" type="text/css">
<link rel="stylesheet" href="{{ '/assets/main-web/uidaho-fonts.css' | relative_url }}" type="text/css">
<link rel="stylesheet" href="{{ '/assets/main-web/styles.css' | relative_url }}?v={{ site.time | date: '%Y-%m-%d' }}" type="text/css">

{% if jekyll.environment == "production" %}
{% include analytics.html %}
{%- endif -%}
