<script>
// Floor Map Interactive Application - Handles SVG loading, room selection, search, and URL state management

(function() {
  'use strict';

  // State
  let currentFloor = null;
  let allFloorsData = {}; // Store data for all floors
  let floorData = null;
  let selectedRoomId = null;
  let svgDocument = null;
  let panZoomInstance = null;
  let currentMode = 'browse'; // 'browse' or 'tour'
  let currentTourStop = 0;
  let currentSheetState = 'peek'; // 'peek' | 'half' | 'full' (mobile bottom sheet only)
  let sheetStateBeforeDetail = 'half'; // sheet state to restore when backing out of a room detail

  /**
   * Initialize the floor map application
   */
  function init() {
    // Load all floor data first
    loadAllFloorData();

    // Find all floor map containers on the page
    const containers = document.querySelectorAll('.floor-map-container');

    containers.forEach(container => {
      const floor = parseInt(container.getAttribute('data-floor'));
      initFloor(floor);
    });

    // Keep the mobile sheet keyboard-aware and the page from fighting its
    // fixed positioning; page-global rather than per-floor since there's
    // only ever one active sheet on this page
    updateScrollLock();
    window.matchMedia('(max-width: 767px)').addEventListener('change', updateScrollLock);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleViewportMetricsUpdate);
      window.visualViewport.addEventListener('scroll', scheduleViewportMetricsUpdate);
      updateViewportMetrics();
    }
  }

  /**
   * Load data for all floors into memory. The set of floor numbers comes
   * from the container's data-floor-numbers attribute (server-rendered from
   * site.data.floors) rather than a hardcoded range, so this stays correct
   * if floors are ever added or removed.
   */
  function loadAllFloorData() {
    const container = document.querySelector('.floor-map-container');
    const floorNumbers = container
      ? (container.getAttribute('data-floor-numbers') || '')
          .split(',')
          .map(n => parseInt(n, 10))
          .filter(n => !isNaN(n))
      : [1, 2, 3, 4];

    floorNumbers.forEach(i => {
      const dataScript = document.getElementById(`floor-${i}-data`);
      if (dataScript) {
        try {
          allFloorsData[i] = JSON.parse(dataScript.textContent);
        } catch (e) {
          console.error(`Error parsing floor ${i} data:`, e);
        }
      }
    });
  }

  /**
   * Whether the mobile bottom-sheet layout is currently active
   */
  function isMobileLayout() {
    return window.matchMedia('(max-width: 767px)').matches;
  }

  /**
   * The height of the actually-visible viewport. VisualViewport shrinks when
   * a virtual keyboard opens; window.innerHeight generally does not, which is
   * why sheet-sizing math needs this instead of a bare innerHeight read.
   */
  function currentViewportHeight() {
    return window.visualViewport ? window.visualViewport.height : window.innerHeight;
  }

  /**
   * Measure how tall the currently-visible panel content actually is (sheet
   * chrome + whichever of detail/tour/browse is showing), independent of the
   * flex-grow stretching those elements use at rest. Lets the Half snap state
   * hug short content (e.g. a brief room description) instead of always
   * claiming a fixed slice of the screen.
   */
  function measureVisibleContentHeight() {
    const sidePane = document.getElementById('side-pane-1');
    if (!sidePane) return 0;

    const chrome = sidePane.querySelector('.sheet-chrome');
    let total = chrome ? chrome.offsetHeight : 0;

    const detailView = document.getElementById('detail-view-1');
    const tourContent = sidePane.querySelector('.mode-content[data-mode-content="tour"]');
    const browseContent = sidePane.querySelector('.mode-content[data-mode-content="browse"]');

    let target = null;
    if (detailView && detailView.style.display !== 'none') {
      target = detailView;
    } else if (tourContent && tourContent.style.display !== 'none') {
      target = tourContent;
    } else if (browseContent) {
      target = browseContent;
    }

    if (target) {
      // Temporarily stop the flex-grow stretch so scrollHeight reflects the
      // content's natural size rather than the box's stretched size
      const prevFlex = target.style.flex;
      const prevOverflow = target.style.overflow;
      target.style.flex = '0 0 auto';
      target.style.overflow = 'visible';
      total += target.scrollHeight;
      target.style.flex = prevFlex;
      target.style.overflow = prevOverflow;
    }

    return total;
  }

  /**
   * Measure the minimal "Peek" content height: the sheet chrome alone (handle
   * + search bar, or the compact context-bar row), plus — in Tour mode
   * only — the tour's compact nav row/name/short-description slice, so
   * stepping through tour stops stays a single tap without expanding the sheet.
   */
  function measurePeekContentHeight() {
    const sidePane = document.getElementById('side-pane-1');
    if (!sidePane) return 0;

    const chrome = sidePane.querySelector('.sheet-chrome');
    let total = chrome ? chrome.offsetHeight : 0;

    const detailView = document.getElementById('detail-view-1');
    if (detailView && detailView.style.display !== 'none') {
      return total; // detail peek = chrome only (context bar already shows the room name)
    }

    const tourContent = sidePane.querySelector('.mode-content[data-mode-content="tour"]');
    if (tourContent && tourContent.style.display !== 'none') {
      const slice = document.getElementById('tour-peek-slice');
      total += slice ? slice.offsetHeight : 0;
    }

    return total; // browse peek = chrome only (search bar), no room-list preview
  }

  /**
   * Set the mobile bottom sheet's snap state ('peek' | 'half' | 'full').
   * No-op on desktop, where the side pane is always fully expanded in-flow.
   */
  function setSheetState(state) {
    if (!isMobileLayout()) return;

    currentSheetState = state;

    const sidePane = document.getElementById('side-pane-1');
    if (!sidePane) return;

    if (state === 'peek') {
      // Size Peek to just the chrome (+ compact tour slice), not a flat height.
      // The ceiling is deliberately generous (not a tight "minimal" number): the
      // tour slice's height comes from RFS-scaled type, which tracks viewport
      // *width*, not height, so a plain fraction-of-height cap can clip a short
      // device's Prev/Next row even though the same content fits fine elsewhere.
      const measured = measurePeekContentHeight();
      const clamped = Math.min(Math.max(measured, 72), currentViewportHeight() * 0.35);
      sidePane.style.setProperty('--sheet-peek', `${clamped}px`);
    }

    if (state === 'half') {
      // Size Half to the actual content, not a flat fraction of the screen
      const measured = measureVisibleContentHeight();
      const clamped = Math.min(Math.max(measured, 170), currentViewportHeight() * 0.42);
      sidePane.style.setProperty('--sheet-half', `${clamped}px`);
    }

    sidePane.setAttribute('data-sheet-state', state);

    const handle = document.getElementById('sheet-handle-1');
    if (handle) handle.setAttribute('aria-expanded', state === 'peek' ? 'false' : 'true');

    const expanded = state === 'full';
    ['detail-expand-btn', 'tour-expand-btn'].forEach(function(id) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.setAttribute('aria-expanded', expanded.toString());
      const label = btn.querySelector('.expand-btn-label');
      if (label) {
        label.textContent = expanded
          ? 'Show less'
          : (id === 'tour-expand-btn' ? 'More about this stop' : 'More details');
      }
    });
  }

  /**
   * Tap the handle to toggle the sheet collapsed (Peek) vs. expanded (Half).
   * Collapsing always lands on Peek in one tap regardless of whether the sheet
   * was at Half or Full — "go down" should never take more than one tap. Full
   * is reached separately, via the search field or a content's own "more"
   * expand button, so this toggle only has to move between two states.
   */
  function cycleSheetState() {
    setSheetState(currentSheetState === 'peek' ? 'half' : 'peek');
  }

  /**
   * Move the sheet one snap state up ('up') or down ('down') the Peek -> Half
   * -> Full ladder, clamped at the ends. Backs the handle's swipe gesture —
   * unlike cycleSheetState() (tap), this is the way to actually reach Full,
   * which was otherwise buried behind the search field or a "more" button.
   */
  function stepSheetState(direction) {
    const order = ['peek', 'half', 'full'];
    const currentIndex = order.indexOf(currentSheetState);
    const nextIndex = direction === 'up'
      ? Math.min(currentIndex + 1, order.length - 1)
      : Math.max(currentIndex - 1, 0);
    setSheetState(order[nextIndex]);
  }

  /**
   * Wire a swipe-up/down gesture on `el` that steps the mobile sheet via
   * stepSheetState(). A plain vertical-distance check on touchstart/touchend,
   * not a 1:1 drag-follow — kept deliberately simple.
   *
   * `canSwipe(dy)` gates whether a given drag is allowed to move the sheet,
   * rather than being left to whatever `el` normally does with a vertical
   * drag (e.g. scrolling). The handle passes no gate (it never scrolls); the
   * scrollable detail/tour panes pass one that only allows the gesture at the
   * relevant scroll edge, so mid-scroll drags keep scrolling instead of
   * fighting the sheet for control.
   */
  function attachSheetSwipe(el, canSwipe) {
    if (!el) return;
    const SWIPE_THRESHOLD = 30; // px of vertical travel to count as a swipe, not a tap/scroll
    let touchStartX = null;
    let touchStartY = null;

    el.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    el.addEventListener('touchend', function(e) {
      if (touchStartY === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;

      // Short or mostly-horizontal movement is a tap or an accidental
      // sideways drag — ignore it.
      if (Math.abs(dy) < SWIPE_THRESHOLD || Math.abs(dy) < Math.abs(dx)) return;
      if (canSwipe && !canSwipe(dy)) return;

      // A real, allowed swipe: consume the touch so it doesn't also fire a
      // synthetic click on whatever it started/ended over.
      e.preventDefault();
      stepSheetState(dy < 0 ? 'up' : 'down');
    });

    el.addEventListener('touchcancel', function() {
      touchStartX = null;
      touchStartY = null;
    });
  }

  /**
   * Scroll-edge gate for attachSheetSwipe() on a scrollable content pane:
   * swiping up (toward Full) is only allowed once the pane has nothing left
   * to scroll down to, and swiping down (toward Peek) only once it's already
   * scrolled to the top — otherwise the drag is left to scroll the content.
   */
  function atScrollEdge(el, dy) {
    if (dy < 0) return el.scrollHeight - el.scrollTop - el.clientHeight <= 1;
    return el.scrollTop <= 0;
  }

  /**
   * Push the real visual-viewport height/offset into --vvh/--vv-offset-top
   * (see .side-pane in _features.scss) so the mobile sheet tracks the space
   * actually visible above a virtual keyboard, instead of a static vh figure
   * that ignores it. Also re-runs the current sheet state so an already-open
   * Half/Full sheet re-clamps against the new height rather than overflowing
   * or leaving stale peek/half sizing from before the keyboard opened.
   */
  function updateViewportMetrics() {
    if (!window.visualViewport) return;
    const vv = window.visualViewport;
    document.documentElement.style.setProperty('--vvh', `${vv.height}px`);
    document.documentElement.style.setProperty('--vv-offset-top', `${vv.offsetTop}px`);
    if (isMobileLayout()) setSheetState(currentSheetState);
  }

  let vvUpdatePending = false;
  function scheduleViewportMetricsUpdate() {
    if (vvUpdatePending) return;
    vvUpdatePending = true;
    requestAnimationFrame(function() {
      vvUpdatePending = false;
      updateViewportMetrics();
    });
  }

  /**
   * Lock document scroll while the mobile sheet is active. Plain
   * overflow:hidden on body isn't enough — iOS Safari still allows
   * touch-driven scroll through it — which is what lets the browser's own
   * "scroll focused input into view" behavior fight the fixed-position sheet
   * when the search field is focused. Safe to hold for the whole mobile
   * session: this page has no other scrollable content to lock users out of.
   */
  let scrollLockY = 0;
  function lockBodyScroll() {
    if (document.documentElement.classList.contains('sheet-scroll-locked')) return;
    scrollLockY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.classList.add('sheet-scroll-locked');
    document.body.style.top = `-${scrollLockY}px`;
  }
  function unlockBodyScroll() {
    if (!document.documentElement.classList.contains('sheet-scroll-locked')) return;
    document.documentElement.classList.remove('sheet-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollLockY);
  }
  function updateScrollLock() {
    if (isMobileLayout()) lockBodyScroll(); else unlockBodyScroll();
  }

  /**
   * Initialize a specific floor. Resolves the real target floor/room/tour
   * state from the URL first (which may differ from the floor Liquid
   * rendered into the page), so a deep link only loads one SVG rather than
   * loading the rendered floor and immediately replacing it.
   */
  function initFloor(floor) {
    const urlState = resolveURLState(floor);
    const targetFloor = urlState.floor;

    currentFloor = targetFloor;

    // Load floor data from JSON
    const dataScript = document.getElementById(`floor-${targetFloor}-data`);
    if (!dataScript) {
      console.error(`Floor ${targetFloor} data not found`);
      return;
    }

    try {
      floorData = JSON.parse(dataScript.textContent);
    } catch (e) {
      console.error(`Error parsing floor ${targetFloor} data:`, e);
      return;
    }

    // Reflect the resolved floor in the tab/dropdown UI and side header,
    // since the server-rendered markup only reflects the Liquid-included floor
    updateFloorTabs(targetFloor);
    updateSideHeader(targetFloor);
    updateFloorGroupCollapse(targetFloor);

    // Load SVG, applying the resolved room/tour state once it's ready
    loadSVG(targetFloor, floorData.svg_path, function() {
      applyURLState(targetFloor, urlState);
    });

    // Set up event listeners
    setupEventListeners(targetFloor);

    // Size the initial Peek height to the real (mobile) chrome rather than
    // leaving the CSS fallback in place indefinitely
    setSheetState('peek');
  }

  /**
   * Load and enhance SVG with data attributes. `onReady` fires once the map
   * is actually interactive (pan/zoom initialized) — or as soon as that's
   * known to be impossible (fetch/parse failure, svg-pan-zoom missing) — so
   * callers can reliably apply a pending room/tour selection instead of
   * racing a fixed setTimeout against the load.
   */
  function loadSVG(floor, svgPath, onReady) {
    // Use the first floor's wrapper for all floors (there's only one SVG container)
    const wrapper = document.getElementById(`svg-wrapper-1`);
    if (!wrapper) {
      if (onReady) onReady();
      return;
    }

    fetch(svgPath)
      .then(response => response.text())
      .then(svgContent => {
        // Insert SVG into wrapper
        wrapper.innerHTML = svgContent;

        // Get SVG document
        const svg = wrapper.querySelector('svg');
        if (!svg) {
          console.error('SVG not found in loaded content');
          if (onReady) onReady();
          return;
        }

        svgDocument = svg;

        // Enhance SVG elements with data attributes
        enhanceSVG(floor, svg);

        // Initialize pan/zoom
        initializePanZoom(floor, svg, onReady);

        // Set up SVG interactions
        setupSVGInteractions(floor, svg);
      })
      .catch(error => {
        console.error('Error loading SVG:', error);
        wrapper.innerHTML = '<div class="alert alert-danger m-3">Error loading map. Please refresh the page.</div>';
        if (onReady) onReady();
      });
  }

  /**
   * Initialize svg-pan-zoom on the SVG element. `onReady` fires once the
   * instance is created (or immediately, degrading gracefully, if the
   * library is missing or initialization throws) so callers have a real
   * signal for "the map can be zoomed/selected now" instead of guessing.
   */
  function initializePanZoom(floor, svg, onReady) {
    // Check if svg-pan-zoom is available
    if (typeof svgPanZoom === 'undefined') {
      console.warn('svg-pan-zoom library not loaded');
      if (onReady) onReady();
      return;
    }

    // Add ID to SVG if it doesn't have one (required by svg-pan-zoom)
    if (!svg.id) {
      svg.id = `floor-${floor}-svg`;
    }

    // Wait a tick for the SVG to be fully rendered in the DOM
    setTimeout(() => {
      try {
        // Destroy existing instance if any
        if (panZoomInstance) {
          panZoomInstance.destroy();
          panZoomInstance = null;
        }

        // Initialize pan/zoom
        panZoomInstance = svgPanZoom(`#${svg.id}`, {
          zoomEnabled: true,
          controlIconsEnabled: false, // We'll use our custom button
          fit: true,
          center: true,
          minZoom: 0.5,
          maxZoom: 10,
          zoomScaleSensitivity: 0.5,
          dblClickZoomEnabled: false,
          mouseWheelZoomEnabled: true,
          preventMouseEventsDefault: false,
          contain: false,
          eventsListenerElement: null
        });

        // Fit and center the SVG initially
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();

        // Add reset zoom button
        addResetZoomButton(floor);

      } catch (e) {
        console.error('Error initializing pan/zoom:', e);
      }
      if (onReady) onReady();
    }, 100);
  }

  /**
   * Add a reset zoom button to the map
   */
  function addResetZoomButton(floor) {
    const mapPane = document.getElementById(`map-pane-1`);
    if (!mapPane) return;

    // Remove existing reset button if any
    const existingBtn = mapPane.querySelector('.reset-zoom-btn');
    if (existingBtn) {
      existingBtn.remove();
    }

    // Create reset button
    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-zoom-btn';
    resetBtn.setAttribute('aria-label', 'Reset zoom');
    resetBtn.innerHTML = `
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10 3a7 7 0 00-7 7h2a5 5 0 015-5V3z"/>
        <path d="M3 10a7 7 0 007 7v-2a5 5 0 01-5-5H3z"/>
        <path d="M10 17a7 7 0 007-7h-2a5 5 0 01-5 5v2z"/>
        <path d="M17 10a7 7 0 00-7-7v2a5 5 0 015 5h2z"/>
      </svg>
    `;
    resetBtn.title = 'Reset zoom and center map';

    resetBtn.addEventListener('click', function() {
      if (panZoomInstance) {
        panZoomInstance.resetZoom();
        panZoomInstance.center();
        panZoomInstance.fit();
      }
    });

    mapPane.appendChild(resetBtn);
  }

  /**
   * Enhance SVG elements with data attributes based on room data
   */
  function enhanceSVG(floor, svg) {
    floorData.rooms.forEach(room => {
      const element = svg.getElementById(room.svg_id);
      if (element) {
        element.setAttribute('data-zone', room.idle_zone || room.zone);
        element.setAttribute('data-room-id', room.room_id);
        element.classList.add('room');
      }
    });
  }

  /**
   * Set up SVG click interactions
   */
  function setupSVGInteractions(floor, svg) {
    // Add click handlers to all room elements
    const rooms = svg.querySelectorAll('.room');
    rooms.forEach(roomElement => {
      roomElement.addEventListener('click', function() {
        const roomId = this.getAttribute('data-room-id');
        selectRoom(floor, roomId);
      });

      // Add hover effect for accessibility
      roomElement.addEventListener('mouseenter', function() {
        this.style.cursor = 'pointer';
      });
    });
  }

  /**
   * Set up event listeners for UI elements
   */
  function setupEventListeners(floor) {
    // Room list item clicks - handle cross-floor navigation
    const roomListItems = document.querySelectorAll(`#room-list-1 .room-list-item`);
    roomListItems.forEach(item => {
      item.addEventListener('click', function() {
        const roomId = this.getAttribute('data-room-id');
        const roomFloor = parseInt(this.getAttribute('data-floor'));

        // If clicking a room on a different floor, switch floors first
        if (roomFloor !== currentFloor) {
          switchToFloor(roomFloor, { roomId });
        } else {
          selectRoom(floor, roomId);
        }
      });
    });

    // Floor group toggles in the Browse room list — expand/collapse a
    // single floor's rooms independent of which floor the map is showing
    const floorGroupLabels = document.querySelectorAll('#room-list-1 .floor-group-label');
    floorGroupLabels.forEach(label => {
      label.addEventListener('click', function() {
        const group = this.closest('.floor-group');
        if (!group) return;
        setFloorGroupCollapsed(group, !group.classList.contains('is-collapsed'));
      });
    });

    // Search input
    const searchInput = document.getElementById(`room-search-1`);
    const searchCancelBtn = document.getElementById(`search-cancel-1`);
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        filterRooms(floor, this.value);
        if (searchCancelBtn) {
          searchCancelBtn.style.display = this.value ? 'inline-flex' : 'none';
        }
      });

      // On mobile, focusing search expands the sheet so results are readable
      searchInput.addEventListener('focus', function() {
        setSheetState('full');
      });
    }

    if (searchCancelBtn) {
      searchCancelBtn.addEventListener('click', function() {
        if (searchInput) {
          searchInput.value = '';
          searchInput.blur();
        }
        filterRooms(floor, '');
        searchCancelBtn.style.display = 'none';
        setSheetState('peek');
      });
    }

    // Back button in detail view (desktop full-width bar; mobile uses the
    // shared context-bar icon below instead)
    const backBtn = document.querySelector(`#detail-view-1 .back-btn`);
    if (backBtn) {
      backBtn.addEventListener('click', function() {
        deselectRoom(floor);
      });
    }

    // Mobile context-bar back/exit icon: goes "back" to Browse either way,
    // but from which state depends on what's currently showing — a room
    // detail (back to the list) or Tour mode (exit the tour entirely). The
    // icon itself swaps between a back-chevron and an X to match (see
    // updateContextBar).
    const contextBackBtn = document.getElementById('context-bar-back-1');
    if (contextBackBtn) {
      contextBackBtn.addEventListener('click', function() {
        const detailView = document.getElementById('detail-view-1');
        if (detailView && detailView.style.display !== 'none') {
          deselectRoom(floor);
        } else {
          exitTour(floor);
        }
      });
    }

    // Mobile bottom-sheet handle: tap to collapse to Peek, or expand to Half.
    // Swipe up/down steps through Peek -> Half -> Full (or back down) instead,
    // so Full is reachable with a gesture rather than hunting for a button.
    // The handle never scrolls, so its swipe is ungated (always allowed).
    const sheetHandle = document.getElementById(`sheet-handle-1`);
    if (sheetHandle) {
      sheetHandle.addEventListener('click', function() {
        cycleSheetState();
      });
      attachSheetSwipe(sheetHandle, null);
    }

    // Room detail and Tour content also accept the swipe gesture — e.g.
    // swiping up on a room's Half-height detail card takes it to Full — but
    // only at the top/bottom of their own scroll, so a swipe partway through
    // a long description scrolls the text instead of yanking the sheet out
    // from under it. The Browse room list deliberately does NOT get this: it
    // scrolls constantly by comparison, so gating there would be fighting the
    // list's normal scroll far more often than it helps.
    const detailView = document.getElementById('detail-view-1');
    attachSheetSwipe(detailView, function(dy) {
      return atScrollEdge(detailView, dy);
    });

    const tourView = document.getElementById('tour-view-1');
    attachSheetSwipe(tourView, function(dy) {
      return atScrollEdge(tourView, dy);
    });

    // "More details" affordance in the room detail view
    const detailExpandBtn = document.getElementById('detail-expand-btn');
    if (detailExpandBtn) {
      detailExpandBtn.addEventListener('click', function() {
        setSheetState(currentSheetState === 'full' ? 'half' : 'full');
      });
    }

    // Floor tabs (now a floating control shared by desktop and mobile)
    const floorTabs = document.querySelectorAll('.floor-tab');
    floorTabs.forEach(tab => {
      tab.addEventListener('click', function() {
        const targetFloor = parseInt(this.getAttribute('data-floor'));
        if (targetFloor !== currentFloor) {
          switchToFloor(targetFloor);
        }
      });
    });

    // Mode buttons (desktop tabs + mobile panel-menu items)
    const modeBtns = document.querySelectorAll(`#side-pane-1 .mode-btn, .panel-mode-item`);
    modeBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const mode = this.getAttribute('data-mode');
        switchMode(floor, mode);
        closePanelMenu();
      });
    });

    // Mobile panel menu: open/close + position the popover, which is
    // deliberately rendered outside .side-pane (see setupPanelMenu)
    setupPanelMenu(floor);

    // Set the initial search-vs-context-bar row now that listeners exist
    updateContextBar(floor);
  }

  /**
   * Wire up the mobile panel-menu popover (Browse/Tour switcher). The popover
   * lives outside .side-pane in the DOM so it isn't trapped by the sheet's
   * overflow:hidden + translateY, which in Peek state pushes most of the
   * sheet's box off-screen. Position is computed from the trigger button's
   * on-screen rect each time it opens, rather than via CSS anchoring.
   */
  function setupPanelMenu(floor) {
    const trigger = document.getElementById('panel-menu-btn-1');
    const popover = document.getElementById('panel-menu-popover-1');
    if (!trigger || !popover) return;

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      if (popover.hidden) {
        openPanelMenu();
      } else {
        closePanelMenu();
      }
    });

    document.addEventListener('click', function(e) {
      if (!popover.hidden && !popover.contains(e.target) && e.target !== trigger) {
        closePanelMenu();
      }
    });

    // Escape closes the popover if it's open; otherwise, if a tour is in
    // session, Escape exits it — nobody should feel stuck in that mode,
    // keyboard-only or otherwise
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      if (!popover.hidden) {
        closePanelMenu();
        trigger.focus();
        return;
      }
      if (currentMode === 'tour') {
        exitTour(floor);
      }
    });

    // Reposition is not attempted mid-open; simplest and least error-prone
    // is to just close if the layout shifts under the open popover
    window.addEventListener('scroll', function() {
      if (!popover.hidden) closePanelMenu();
    }, { passive: true });
    window.addEventListener('resize', function() {
      if (!popover.hidden) closePanelMenu();
    });
  }

  /**
   * Exit Tour mode back to Browse — the default resting state (search bar
   * at Peek, nothing highlighted on the map) — and move focus somewhere
   * useful (the search field) rather than letting it fall into a now-hidden
   * element. Used by every explicit "leave the tour" affordance (the mobile
   * context bar's X, the Exit Tour button, and the Escape key) so all three
   * behave identically and predictably for keyboard/screen-reader users.
   */
  function exitTour(floor) {
    switchMode(floor, 'browse');
    const searchInput = document.getElementById('room-search-1');
    if (searchInput) searchInput.focus();
    // Focusing the search field triggers its own focus listener, which
    // expands the sheet to Full — override that back to Peek so exiting
    // the tour actually lands on the calm default view, not a full-screen
    // room list.
    setSheetState('peek');
  }

  function openPanelMenu() {
    const trigger = document.getElementById('panel-menu-btn-1');
    const popover = document.getElementById('panel-menu-popover-1');
    if (!trigger || !popover) return;

    const rect = trigger.getBoundingClientRect();
    const popoverHeight = 108; // two menu items, roughly
    const spaceBelow = window.innerHeight - rect.bottom;

    popover.style.left = `${Math.max(8, rect.right - 190)}px`;
    if (spaceBelow < popoverHeight + 12) {
      // Not enough room below (e.g. sheet in Peek near the bottom of the
      // screen) — open upward from the trigger instead
      popover.style.top = `${Math.max(8, rect.top - popoverHeight - 8)}px`;
    } else {
      popover.style.top = `${rect.bottom + 8}px`;
    }

    popover.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
  }

  function closePanelMenu() {
    const trigger = document.getElementById('panel-menu-btn-1');
    const popover = document.getElementById('panel-menu-popover-1');
    if (!trigger || !popover) return;

    popover.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
  }

  /**
   * Switch to a different floor. `options.roomId` selects a room once the
   * new floor's map is ready; `options.mode`/`options.stopIndex` instead
   * launch Tour mode at a given stop. Selection is applied via loadSVG's
   * onReady callback (the map being actually interactive), not a guessed
   * timeout.
   */
  function switchToFloor(targetFloor, options = {}) {
    if (!allFloorsData[targetFloor]) {
      console.error(`Floor ${targetFloor} data not found`);
      return;
    }

    const hasExplicitTarget = !!options.roomId || options.mode === 'tour';

    // Plain floor-tab switches should behave like "Back to browse" first:
    // clear any active room/detail/tour state before loading the new floor.
    if (!hasExplicitTarget) {
      selectedRoomId = null;
      clearSVGSelection(currentFloor);
      clearRoomListSelection(currentFloor);
    }

    // Update current floor and floor data
    currentFloor = targetFloor;
    floorData = allFloorsData[targetFloor];

    if (!hasExplicitTarget) {
      switchMode(targetFloor, 'browse');
    }

    // Update floor tabs and side header
    updateFloorTabs(targetFloor);
    updateSideHeader(targetFloor);
    updateFloorGroupCollapse(targetFloor);

    // Load new SVG, applying any requested room/tour state once ready
    loadSVG(targetFloor, floorData.svg_path, function() {
      if (options.roomId) {
        selectRoom(targetFloor, options.roomId);
      } else if (options.mode === 'tour') {
        switchMode(targetFloor, 'tour', { stopIndex: options.stopIndex || 0 });
      } else {
        updateURL(targetFloor, {});
      }
    });
  }

  /**
   * Update floor tabs to show active floor
   */
  function updateFloorTabs(targetFloor) {
    // Update desktop tabs
    const allTabs = document.querySelectorAll('.floor-tab');
    allTabs.forEach(tab => {
      const tabFloor = parseInt(tab.getAttribute('data-floor'));
      if (tabFloor === targetFloor) {
        tab.classList.add('is-active');
      } else {
        tab.classList.remove('is-active');
      }
    });

    // Update mobile dropdown
    const allSelects = document.querySelectorAll('.floor-select');
    allSelects.forEach(select => {
      select.value = targetFloor.toString();
    });
  }

  /**
   * Update the desktop side panel's title/subtitle to match the active
   * floor. These are only ever Liquid-rendered for the floor the page was
   * included with (floor 1), so JS has to keep them in sync on every switch.
   */
  function updateSideHeader(targetFloor) {
    const data = allFloorsData[targetFloor];
    if (!data) return;

    const heading = document.querySelector('.side-header h1');
    const subtitle = document.querySelector('.side-header p');
    if (heading) heading.textContent = data.title;
    if (subtitle) subtitle.textContent = data.subtitle || '';
  }

  /**
   * Collapse every floor group in the Browse room list except the active
   * floor's, so the list opens focused on "here" with other floors a click
   * away rather than one long scroll of every room on every floor.
   */
  function updateFloorGroupCollapse(activeFloor) {
    const groups = document.querySelectorAll('#room-list-1 .floor-group');
    groups.forEach(group => {
      const groupFloor = parseInt(group.getAttribute('data-floor'), 10);
      setFloorGroupCollapsed(group, groupFloor !== activeFloor);
    });
  }

  /**
   * Expand or collapse a single floor group and keep its toggle button's
   * aria-expanded state (and chevron direction, via CSS) in sync.
   */
  function setFloorGroupCollapsed(group, collapsed) {
    group.classList.toggle('is-collapsed', collapsed);
    const label = group.querySelector('.floor-group-label');
    if (label) label.setAttribute('aria-expanded', (!collapsed).toString());
  }

  /**
   * Switch between Browse and Tour modes. `options.stopIndex` (Tour only)
   * picks which stop to open on, e.g. from a resolved `?stop=` URL param.
   */
  function switchMode(floor, mode, options = {}) {
    const previousMode = currentMode;
    currentMode = mode;

    // Update mode buttons (desktop tabs + mobile panel-menu items)
    const modeBtns = document.querySelectorAll(`#side-pane-1 .mode-btn, .panel-mode-item`);
    modeBtns.forEach(btn => {
      const isActive = btn.getAttribute('data-mode') === mode;
      btn.classList.toggle('is-active', isActive);
      if (btn.classList.contains('panel-mode-item')) {
        btn.setAttribute('aria-checked', isActive.toString());
      }
    });

    // Show/hide mode content
    const browseContent = document.querySelector(`#side-pane-1 .mode-content[data-mode-content="browse"]`);
    const tourContent = document.querySelector(`#side-pane-1 .mode-content[data-mode-content="tour"]`);
    const detailView = document.getElementById(`detail-view-1`);

    if (mode === 'browse') {
      if (browseContent) browseContent.style.display = 'flex';
      if (tourContent) tourContent.style.display = 'none';
      // Switching back to Browse (e.g. from the panel menu while viewing a
      // room) should also close out of the detail view, matching the Tour branch below
      if (detailView) detailView.style.display = 'none';

      // Leaving Tour specifically (not just re-clicking Browse while already
      // there) — the map is still zoomed/panned to wherever the last stop
      // left it, with that stop's outline still showing. Reset both so
      // Browse starts from a clean, unzoomed view rather than carrying tour
      // state over.
      if (previousMode === 'tour') {
        clearSVGSelection(floor);
        if (panZoomInstance) {
          panZoomInstance.resetZoom();
          panZoomInstance.center();
          panZoomInstance.fit();
        }
      }

      // Leaving/staying in Browse always resolves to a plain floor URL —
      // any room/tour state belongs to the view being left
      updateURL(currentFloor, {});
    } else if (mode === 'tour') {
      if (browseContent) browseContent.style.display = 'none';
      if (tourContent) tourContent.style.display = 'flex';
      if (detailView) detailView.style.display = 'none';

      // Initialize tour at the requested stop (defaults to the first)
      initializeTour(floor, options.stopIndex || 0);
    }

    // Search only makes sense in Browse mode; Peek is dynamically measured
    // for both modes now, so it's safe/cheap to resettle it on every switch
    updateContextBar(floor);
    setSheetState('peek');
  }

  /**
   * Decide which of the shared toolbar's two mutually-exclusive rows shows:
   * the search bar (Browse mode, no room open), or the compact context bar —
   * which itself does double duty as "back to browse" (a room is open) or
   * "exit tour" (Tour mode, no room open). Hidden site-wide, not just on
   * mobile, since .search-wrap now lives outside the mode-content it used to
   * be scoped to.
   */
  function updateContextBar(floor) {
    const detailView = document.getElementById('detail-view-1');
    const tourContent = document.querySelector('#side-pane-1 .mode-content[data-mode-content="tour"]');
    const searchWrap = document.querySelector('#sheet-chrome-1 .search-wrap');
    const contextBar = document.getElementById('context-bar-1');
    const contextLabel = document.getElementById('context-bar-label-1');
    const contextBackBtn = document.getElementById('context-bar-back-1');
    if (!searchWrap || !contextBar) return;

    const showingDetail = !!(detailView && detailView.style.display !== 'none');
    const showingTour = !showingDetail && !!(tourContent && tourContent.style.display !== 'none');

    searchWrap.style.display = (showingDetail || showingTour) ? 'none' : 'flex';
    contextBar.style.display = (showingDetail || showingTour) ? 'flex' : 'none';

    if (showingTour && contextLabel) {
      contextLabel.textContent = 'Guided Tour';
      if (contextBackBtn) {
        contextBackBtn.setAttribute('aria-label', 'Exit tour');
        contextBackBtn.classList.add('is-exit');
      }
    } else if (showingDetail && contextBackBtn) {
      contextBackBtn.setAttribute('aria-label', 'Back to browse');
      contextBackBtn.classList.remove('is-exit');
    }
  }

  /**
   * Initialize tour mode
   */
  function initializeTour(floor, startStopIndex = 0) {
    const tourView = document.getElementById(`tour-view-1`);
    if (!tourView) return;

    const tourStops = floorData.tour_stops || [];

    if (tourStops.length === 0) {
      tourView.innerHTML = '<div class="tour-intro"><p>No tour available for this floor.</p></div>';
      return;
    }

    // Clamp a requested starting stop (e.g. from a ?stop= URL param) into range
    const initialStop = Math.min(Math.max(startStopIndex, 0), tourStops.length - 1);

    // Reset tour position
    currentTourStop = initialStop;

    // Build tour UI. The nav row/name/short description form the compact card
    // that's visible at the mobile sheet's Peek height (wrapped in
    // #tour-peek-slice so Peek can be measured and sized to it); the full
    // stop description lives below, revealed only when expanded to Full.
    const tourHTML = `
      <div id="tour-peek-slice">
        <div class="tour-nav-row">
          <button type="button" class="tour-nav-btn" id="tour-prev" aria-label="Previous stop" disabled>
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M12.5 15L7.5 10l5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="tour-progress">Stop <span id="tour-current">${initialStop + 1}</span> of ${tourStops.length}</span>
          <button type="button" class="tour-nav-btn" id="tour-next" aria-label="Next stop">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <h3 class="tour-stop-name" id="tour-stop-name">${tourStops[initialStop].name}</h3>
        <p class="tour-stop-short-desc" id="tour-stop-short-desc"></p>
      </div>

      <button type="button" class="sheet-expand-btn" id="tour-expand-btn" aria-expanded="false" style="display: none;">
        <span class="expand-btn-label">More about this stop</span>
        <svg class="expand-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="tour-expand-content">
        <p class="tour-stop-description" id="tour-stop-description"></p>
        <button type="button" class="tour-exit-btn" id="tour-exit-btn">Exit Tour</button>
      </div>
    `;

    tourView.innerHTML = tourHTML;

    // Set up tour controls
    const prevBtn = document.getElementById('tour-prev');
    const nextBtn = document.getElementById('tour-next');

    if (prevBtn) {
      prevBtn.addEventListener('click', () => navigateTour(floor, -1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => navigateTour(floor, 1));
    }

    const tourExpandBtn = document.getElementById('tour-expand-btn');
    if (tourExpandBtn) {
      tourExpandBtn.addEventListener('click', function() {
        setSheetState(currentSheetState === 'full' ? 'peek' : 'full');
      });
    }

    // Sits at the bottom of the stop's expanded details — always visible on
    // desktop (nothing there is collapsed), and on mobile once someone has
    // expanded to read more, which is exactly when they're likely done and
    // ready to leave
    const tourExitBtn = document.getElementById('tour-exit-btn');
    if (tourExitBtn) {
      tourExitBtn.addEventListener('click', function() {
        exitTour(floor);
      });
    }

    // Show the starting tour stop
    showTourStop(floor, initialStop);
  }

  /**
   * Navigate to previous/next tour stop
   */
  function navigateTour(floor, direction) {
    const tourStops = floorData.tour_stops || [];
    const newStop = currentTourStop + direction;

    if (newStop >= 0 && newStop < tourStops.length) {
      currentTourStop = newStop;
      showTourStop(floor, newStop);
    }
  }

  /**
   * Show a specific tour stop
   */
  function showTourStop(floor, stopIndex) {
    const tourStops = floorData.tour_stops || [];
    if (stopIndex < 0 || stopIndex >= tourStops.length) return;

    const stop = tourStops[stopIndex];
    const room = floorData.rooms.find(r => r.svg_id === stop.svg_id);

    // Update tour progress
    const currentSpan = document.getElementById('tour-current');
    if (currentSpan) {
      currentSpan.textContent = stopIndex + 1;
    }

    // Update stop name
    const nameEl = document.getElementById('tour-stop-name');
    if (nameEl) {
      nameEl.textContent = stop.name;
    }

    // Short description is part of the compact Peek card itself
    const shortDescEl = document.getElementById('tour-stop-short-desc');
    if (shortDescEl) {
      const hasShort = !!(room && room.short_description);
      shortDescEl.textContent = hasShort ? room.short_description : '';
      shortDescEl.style.display = hasShort ? 'block' : 'none';
    }

    // Full description, revealed via "More about this stop" — only offered
    // when there's something beyond what Peek already shows
    const hasLongDesc = !!(room && room.long_description && room.long_description.trim());
    const descEl = document.getElementById('tour-stop-description');
    if (descEl) {
      descEl.textContent = hasLongDesc ? room.long_description : '';
      descEl.style.display = hasLongDesc ? 'block' : 'none';
    }
    const expandBtn = document.getElementById('tour-expand-btn');
    if (expandBtn) {
      expandBtn.style.display = (isMobileLayout() && hasLongDesc) ? 'inline-flex' : 'none';
    }

    // Update button states — Previous/Next are icon-only, so "nowhere left to
    // go" is communicated by disabling rather than relabeling to "Finish Tour"
    const prevBtn = document.getElementById('tour-prev');
    const nextBtn = document.getElementById('tour-next');

    if (prevBtn) {
      prevBtn.disabled = (stopIndex === 0);
    }
    if (nextBtn) {
      nextBtn.disabled = (stopIndex === tourStops.length - 1);
    }

    // Highlight and zoom to room on map. Zoomed out further than a regular
    // room selection so the stop reads in context of the rest of the floor —
    // stepping through several stops in a row is a very different experience
    // from tapping one room and being done, and shouldn't feel like it's
    // constantly re-framing the view.
    updateSVGSelection(floor, stop.svg_id);
    zoomToRoom(stop.svg_id, { padding: 2.4, minEffectiveZoom: 0.9, maxEffectiveZoom: 1.7 });

    // Keep the address bar pointed at this exact stop so it's copyable/shareable
    updateURL(currentFloor, { mode: 'tour', stop: stopIndex + 1 });
  }

  /**
   * Select a room and show its detail view
   */
  function selectRoom(floor, roomId) {
    selectedRoomId = roomId;

    // Find room data
    const room = floorData.rooms.find(r => r.room_id === roomId);
    if (!room) {
      console.error(`Room ${roomId} not found`);
      return;
    }

    // Update SVG selection
    updateSVGSelection(floor, room.svg_id);

    // Zoom to room
    zoomToRoom(room.svg_id);

    // Update room list selection
    updateRoomListSelection(floor, roomId);

    // Show detail view
    showDetailView(floor, room);

    // On mobile, remember what the sheet was showing so the back button can
    // restore it, then settle on the compact detail summary height
    sheetStateBeforeDetail = currentSheetState;
    setSheetState('half');

    // Update URL
    updateURL(currentFloor, { room: roomId });
  }

  /**
   * Zoom and pan to center on a specific room. `options.padding` controls how
   * much surrounding context is kept around the room's bounding box (higher =
   * more of the floor visible around it); `options.minEffectiveZoom` is the
   * zoom floor applied to small rooms so they don't render illegibly tiny;
   * `options.maxEffectiveZoom` is the ceiling — for a small room this is
   * usually the value that actually wins (the "fit the bbox" math alone would
   * zoom in far more tightly than that), so it matters at least as much as
   * padding for controlling how much floor context stays visible.
   */
  function zoomToRoom(svgId, options) {
    if (!panZoomInstance || !svgDocument) return;

    const roomElement = svgDocument.getElementById(svgId);
    if (!roomElement) return;

    const opts = options || {};

    try {
      // Get the bounding box of the room
      const bbox = roomElement.getBBox();

      // Calculate room center in SVG coordinates
      const roomCenterX = bbox.x + bbox.width / 2;
      const roomCenterY = bbox.y + bbox.height / 2;

      // Get viewport dimensions
      const sizes = panZoomInstance.getSizes();
      const viewportWidth = sizes.width;
      const viewportHeight = sizes.height;


      // Calculate zoom to fit room with padding
      const padding = opts.padding || 1.5;
      const zoomX = viewportWidth / (bbox.width * padding);
      const zoomY = viewportHeight / (bbox.height * padding);
      let targetZoom = Math.min(zoomX, zoomY);

      // Clamp zoom
      const maxEffectiveZoom = opts.maxEffectiveZoom || 3;
      targetZoom = Math.max(0.8, Math.min(targetZoom, maxEffectiveZoom));

      // Reset to fit/center state (zoom = 1 relative to fit)
      panZoomInstance.resetZoom();
      panZoomInstance.resetPan();

      // Get the "real" zoom after reset (this is the scale factor to fit SVG in viewport)
      const realZoom = panZoomInstance.getSizes().realZoom;

      // Absolute minimum effective zoom, so small rooms still render legibly
      // effectiveZoom = realZoom * zoomBy, so: zoomBy = desiredEffective / realZoom
      const minEffectiveZoom = opts.minEffectiveZoom || 1.2;
      const desiredEffectiveZoom = Math.max(targetZoom, minEffectiveZoom);

      // Calculate how much to zoom relative to the fit state
      const relativeZoom = desiredEffectiveZoom / realZoom;


      // Apply the zoom
      panZoomInstance.zoomBy(relativeZoom);

      // The effective zoom is now what we desired
      const effectiveZoom = desiredEffectiveZoom;

      // Calculate pan to center the room
      const panX = (viewportWidth / 2) - (roomCenterX * effectiveZoom);
      const panY = (viewportHeight / 2) - (roomCenterY * effectiveZoom);


      // Apply the pan
      panZoomInstance.pan({x: panX, y: panY});

    } catch (e) {
      console.error('Could not zoom to room:', e);
    }
  }

  /**
   * Deselect current room and return to browse view
   */
  function deselectRoom(floor) {
    selectedRoomId = null;

    // Clear SVG selection
    clearSVGSelection(floor);

    // Clear room list selection
    clearRoomListSelection(floor);

    // Hide detail view and show browse view
    hideDetailView(floor);

    // Restore whatever the sheet was showing before this room was selected
    setSheetState(sheetStateBeforeDetail || 'half');

    // Update URL
    updateURL(currentFloor, {});
  }

  /**
   * Update SVG to show selected room
   */
  function updateSVGSelection(floor, svgId) {
    if (!svgDocument) return;

    // Remove previous selection
    clearSVGSelection(floor);

    // Add selection to new room
    const roomElement = svgDocument.getElementById(svgId);
    if (roomElement) {
      roomElement.classList.add('is-selected');
      // Reveal the room's true zone color, overriding any idle_zone blend
      const room = floorData.rooms.find(r => r.svg_id === svgId);
      if (room && room.idle_zone) {
        roomElement.setAttribute('data-zone', room.zone);
      }
    }

    // Add has-selection class to map pane
    const mapPane = document.getElementById(`map-pane-1`);
    if (mapPane) {
      mapPane.classList.add('has-selection');
    }
  }

  /**
   * Clear SVG selection
   */
  function clearSVGSelection(floor) {
    if (!svgDocument) return;

    const selectedElements = svgDocument.querySelectorAll('.is-selected');
    selectedElements.forEach(el => {
      el.classList.remove('is-selected');
      // Restore the idle_zone blend, if this room has one
      const room = floorData.rooms.find(r => r.svg_id === el.id);
      if (room && room.idle_zone) {
        el.setAttribute('data-zone', room.idle_zone);
      }
    });

    const mapPane = document.getElementById(`map-pane-1`);
    if (mapPane) {
      mapPane.classList.remove('has-selection');
    }
  }

  /**
   * Update room list to show selected room
   */
  function updateRoomListSelection(floor, roomId) {
    const items = document.querySelectorAll(`#room-list-1 .room-list-item`);
    items.forEach(item => {
      if (item.getAttribute('data-room-id') === roomId) {
        item.classList.add('is-selected');
      } else {
        item.classList.remove('is-selected');
      }
    });
  }

  /**
   * Clear room list selection
   */
  function clearRoomListSelection(floor) {
    const items = document.querySelectorAll(`#room-list-1 .room-list-item`);
    items.forEach(item => item.classList.remove('is-selected'));
  }

  /**
   * Show detail view for a room
   */
  function showDetailView(floor, room) {
    const detailView = document.getElementById(`detail-view-1`);
    const browseView = document.querySelector(`#side-pane-1 .mode-content[data-mode-content="browse"]`);

    if (!detailView) return;

    // Get zone info
    const zone = floorData.zones[room.zone];

    // Populate detail view
    const zoneTag = document.getElementById('detail-zone-tag');
    const name = document.getElementById('detail-name');
    const roomNumber = document.getElementById('detail-room-number');
    const shortDesc = document.getElementById('detail-short-desc');
    const longDesc = document.getElementById('detail-long-desc');
    const moreInfoBtn = document.getElementById('detail-more-info');
    const actionBtn = document.getElementById('detail-action');

    if (zoneTag && zone) {
      zoneTag.textContent = zone.label;
      zoneTag.style.backgroundColor = zone.color;
    }

    if (name) name.textContent = room.name;

    const contextLabel = document.getElementById('context-bar-label-1');
    if (contextLabel) contextLabel.textContent = room.name;

    if (roomNumber) {
      if (room.room_number) {
        roomNumber.textContent = `Room ${room.room_number}`;
        roomNumber.style.display = 'block';
      } else {
        roomNumber.style.display = 'none';
      }
    }

    if (shortDesc) {
      if (room.short_description) {
        shortDesc.textContent = room.short_description;
        shortDesc.style.display = 'block';
      } else {
        shortDesc.style.display = 'none';
      }
    }

    if (longDesc) {
      if (room.long_description) {
        longDesc.textContent = room.long_description;
        longDesc.style.display = 'block';
      } else {
        longDesc.style.display = 'none';
      }
    }

    // "More details" affordance: only worth showing on mobile, and only when
    // there's a long description to reveal by expanding the sheet
    const expandBtn = document.getElementById('detail-expand-btn');
    if (expandBtn) {
      const hasMore = isMobileLayout() && !!(room.long_description && room.long_description.trim());
      expandBtn.style.display = hasMore ? 'inline-flex' : 'none';
      expandBtn.setAttribute('aria-expanded', 'false');
      const label = expandBtn.querySelector('.expand-btn-label');
      if (label) label.textContent = 'More details';
    }

    // Handle action buttons
    if (moreInfoBtn) {
      if (room.more_info_url) {
        moreInfoBtn.href = room.more_info_url;
        moreInfoBtn.style.display = 'inline-block';
      } else {
        moreInfoBtn.style.display = 'none';
      }
    }

    if (actionBtn) {
      if (room.action_url && room.action_label) {
        actionBtn.href = room.action_url;
        actionBtn.textContent = room.action_label;
        actionBtn.style.display = 'inline-block';
      } else {
        actionBtn.style.display = 'none';
      }
    }

    // Show detail view, hide browse view
    if (browseView) browseView.style.display = 'none';
    detailView.style.display = 'flex';
    updateContextBar(floor);

    // Give screen reader users positional confirmation that the sheet's
    // content changed, since it reflows without a page navigation
    if (isMobileLayout() && name) {
      name.setAttribute('tabindex', '-1');
      name.focus({ preventScroll: true });
    }
  }

  /**
   * Hide detail view and show browse view
   */
  function hideDetailView(floor) {
    const detailView = document.getElementById(`detail-view-1`);
    const browseView = document.querySelector(`#side-pane-1 .mode-content[data-mode-content="browse"]`);

    if (detailView) detailView.style.display = 'none';
    if (browseView) browseView.style.display = 'flex';
    updateContextBar(floor);
  }

  /**
   * Filter rooms based on search query
   */
  function filterRooms(floor, query) {
    const lowerQuery = query.toLowerCase().trim();
    const items = document.querySelectorAll(`#room-list-1 .room-list-item`);
    const floorGroups = document.querySelectorAll(`#room-list-1 .floor-group`);

    if (!lowerQuery) {
      // Show all rooms and groups, then restore the per-floor collapse state
      // (only the active floor expanded) now that search has been cleared
      items.forEach(item => item.classList.remove('is-hidden'));
      floorGroups.forEach(group => group.style.display = 'block');
      updateFloorGroupCollapse(currentFloor);
      return;
    }

    // A search is in progress — expand every floor group so matches on
    // collapsed floors aren't hidden behind their (unrelated) collapse state
    floorGroups.forEach(group => setFloorGroupCollapsed(group, false));

    // Filter rooms across all floors
    items.forEach(item => {
      const roomId = item.getAttribute('data-room-id');
      const itemFloor = parseInt(item.getAttribute('data-floor'));

      // Get room data from the appropriate floor
      const itemFloorData = allFloorsData[itemFloor];
      if (!itemFloorData) {
        item.classList.add('is-hidden');
        return;
      }

      const room = itemFloorData.rooms.find(r => r.room_id === roomId);
      if (!room) {
        item.classList.add('is-hidden');
        return;
      }

      // Search in room name, description, and room number
      const searchText = [
        room.name,
        room.short_description,
        room.long_description,
        room.room_number
      ].filter(Boolean).join(' ').toLowerCase();

      if (searchText.includes(lowerQuery)) {
        item.classList.remove('is-hidden');
      } else {
        item.classList.add('is-hidden');
      }
    });

    // Hide floor groups with no visible items
    floorGroups.forEach(group => {
      const visibleItems = group.querySelectorAll('.room-list-item:not(.is-hidden)');
      if (visibleItems.length === 0) {
        group.style.display = 'none';
      } else {
        group.style.display = 'block';
      }
    });
  }

  /**
   * Resolve the floor/room/tour state a page load should land on from the
   * URL, tolerating partial or malformed input rather than doing nothing:
   *   ?floor=<n>              — a specific floor (falls back to defaultFloor
   *                              if unknown/non-numeric)
   *   ?room=<room_id>         — a specific room, found by searching every
   *                              floor's data (its real floor wins over a
   *                              missing/mismatched ?floor=)
   *   ?mode=tour[&stop=<n or room_id>] — launches Tour mode, optionally at a
   *                              given stop (1-based index, or a room_id for
   *                              a link that stays valid if stops are reordered)
   * `defaultFloor` is the floor Liquid rendered into the page (always 1
   * today, since only one floor-map-container exists per page).
   */
  function resolveURLState(defaultFloor) {
    const params = new URLSearchParams(window.location.search);
    const rawFloor = params.get('floor');
    const roomParam = params.get('room');
    const modeParam = params.get('mode');
    const stopParam = params.get('stop');

    const state = { floor: defaultFloor, room: null, mode: null, stopIndex: 0 };

    // A room id, if present, is searched for across every floor's data so a
    // link that omits ?floor= (or gets it wrong) still lands in the right place
    let roomFloor = null;
    if (roomParam) {
      for (const key in allFloorsData) {
        const data = allFloorsData[key];
        if (data && data.rooms && data.rooms.some(r => r.room_id === roomParam)) {
          roomFloor = parseInt(key, 10);
          break;
        }
      }
    }

    if (roomFloor !== null) {
      state.floor = roomFloor;
      if (rawFloor && parseInt(rawFloor, 10) !== roomFloor) {
        console.warn(`Floor map: room "${roomParam}" is on floor ${roomFloor}, not floor ${rawFloor} as given in the URL — showing floor ${roomFloor}.`);
      }
      state.room = roomParam;
      return state;
    }

    if (roomParam) {
      console.warn(`Floor map: room "${roomParam}" from the URL was not found on any floor.`);
    }

    if (rawFloor) {
      const parsedFloor = parseInt(rawFloor, 10);
      if (!isNaN(parsedFloor) && allFloorsData[parsedFloor]) {
        state.floor = parsedFloor;
      } else {
        console.warn(`Floor map: unknown floor "${rawFloor}" in the URL — showing floor ${defaultFloor} instead.`);
      }
    }

    if (modeParam === 'tour') {
      state.mode = 'tour';
      const tourStops = (allFloorsData[state.floor] && allFloorsData[state.floor].tour_stops) || [];
      state.stopIndex = resolveStopIndex(stopParam, tourStops);
    }

    return state;
  }

  /**
   * Resolve a ?stop= value (1-based stop number, or a stop's room_id) to a
   * 0-based index, clamped/defaulted rather than failing on bad input.
   */
  function resolveStopIndex(stopParam, tourStops) {
    if (!stopParam || tourStops.length === 0) return 0;

    const asNumber = parseInt(stopParam, 10);
    if (!isNaN(asNumber) && asNumber >= 1 && asNumber <= tourStops.length) {
      return asNumber - 1;
    }

    const byRoomId = tourStops.findIndex(stop => stop.room_id === stopParam);
    if (byRoomId !== -1) return byRoomId;

    console.warn(`Floor map: unknown tour stop "${stopParam}" in the URL — starting at stop 1.`);
    return 0;
  }

  /**
   * Apply a resolved URL state (see resolveURLState) once the target
   * floor's map is ready. No-op for plain browse — the floor itself is
   * already loaded by the caller.
   */
  function applyURLState(floor, urlState) {
    if (urlState.room) {
      selectRoom(floor, urlState.room);
    } else if (urlState.mode === 'tour') {
      switchMode(floor, 'tour', { stopIndex: urlState.stopIndex });
    }
  }

  /**
   * Update the URL to reflect current state, so it stays copyable/shareable
   * at any point. `state` is one of: {} (plain browse), {room}, or
   * {mode: 'tour', stop} — never combined, since those views are mutually
   * exclusive in the UI.
   */
  function updateURL(floor, state = {}) {
    const params = new URLSearchParams();
    params.set('floor', floor);

    if (state.room) {
      params.set('room', state.room);
    } else if (state.mode === 'tour') {
      params.set('mode', 'tour');
      if (state.stop) {
        params.set('stop', state.stop);
      }
    }

    const newURL = `${window.location.pathname}?${params.toString()}`;
    window.history.replaceState({ floor, ...state }, '', newURL);
  }

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
