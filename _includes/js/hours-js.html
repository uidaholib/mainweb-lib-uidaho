<script>
(function () {
	var container = document.getElementById('s_lc_tdh_3479_7368');
	if (!container) return;

	var settings = {
		domain: 'https://libcal.uidaho.edu',
		iid: 3479,
		lid: 7368,
		isHomepage: false,
		isSystemTimeFormat: true,
		key: 0,
		date: 'now'
	};

	function loadingMarkup() {
		if (settings.isHomepage) {
			return '<p class="text-center"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-repeat" viewBox="0 0 16 16" aria-hidden="true"> <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41m-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9"/> <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5 5 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z"/> </svg></p>';
		}
		return '<p class="s-lc-w-loading">Loading...</p>';
	}

	function attachControls() {
		var controls = container.querySelectorAll('.s-lc-w-btn');
		controls.forEach(function (button) {
			button.addEventListener('click', function (event) {
				event.preventDefault();
				settings.date = button.getAttribute('data-date') || 'now';
				container.innerHTML = loadingMarkup();
				loadHours(true);
			});
		});
	}

	function loadHours(focusOnLoad) {
		var url = settings.domain + '/widget/hours/today?iid=' + settings.iid +
			'&lid=' + settings.lid +
			'&hp=' + settings.isHomepage +
			'&systemTime=' + settings.isSystemTimeFormat +
			'&key=' + settings.key +
			'&date=' + encodeURIComponent(settings.date);

		fetch(url)
			.then(function (response) {
				if (!response.ok) {
					throw new Error('Failed to load hours widget.');
				}
				return response.text();
			})
			.then(function (html) {
				container.innerHTML = html;
				if (focusOnLoad) {
					var focusTarget = container.querySelector('thead th[tabindex="-1"]');
					if (focusTarget) focusTarget.focus();
				}
				attachControls();
			})
			.catch(function () {
				container.textContent = 'Unable to load hours right now.';
			});
	}

	loadHours(false);
}());
</script>

.s-lc-w-loading { margin-top: 80px; text-align: center; }

.s-lc-w-btn { line-height: 1.5; border-radius: 3px; display: inline-block; padding: 3px 6px; margin-bottom: 0; font-size: 12px; font-weight: 400; text-align: center; white-space: nowrap; vertical-align: middle; touch-action: manipulation; cursor: pointer; user-select: none; border: 1px solid #ccc; color: #333; background-color: #fff; }
.s-lc-w-btn:active, .s-lc-w-btn:hover { color: #333; background-color: #d4d4d4; border-color: #8c8c8c; }

.s-lc-w-next { float: right; }
