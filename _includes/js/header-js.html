<script src="{{ '/assets/main-web/lib/flexsearch.bundle.min.js' | relative_url }}" ></script>
<script>
(function () {
    'use strict';

    var mainNavMenu   = document.getElementById('mainNavMenu');
    var mainMenuBtn   = document.getElementById('mainMenu');
    var navTriggers   = document.querySelectorAll('[data-bs-target="#mainNavMenu"]');
    var lastTrigger   = mainMenuBtn;
    var navSearchInput  = document.getElementById('nav-search-input');
    var navSearchResults = document.getElementById('nav-search-results');
    var navMenuColumns  = document.getElementById('nav-menu-columns');
    var navTimedisp   = document.getElementById('nav-timedisp');
    var timedisp      = document.getElementById('timedisp');

    // ── Helpers ──────────────────────────────────────────────────

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /** Highlight query matches in raw text; returns safe HTML string. */
    function highlight(text, query) {
        if (!query || !text) return escapeHtml(text || '');
        var re = new RegExp(escapeRegex(query), 'gi');
        var result = '';
        var lastIndex = 0;
        var match;
        while ((match = re.exec(text)) !== null) {
            result += escapeHtml(text.slice(lastIndex, match.index));
            result += '<mark class="nav-search-highlight">' + escapeHtml(match[0]) + '</mark>';
            lastIndex = re.lastIndex;
            if (match[0].length === 0) { re.lastIndex++; } // guard zero-width match
        }
        result += escapeHtml(text.slice(lastIndex));
        return result;
    }

    /** Extract a snippet of content around the first match. */
    function getSnippet(text, query) {
        if (!text) return '';
        var lower = text.toLowerCase();
        var idx = query ? lower.indexOf(query.toLowerCase()) : -1;
        if (idx === -1) return text.slice(0, 200) + (text.length > 200 ? '…' : '');
        var start = Math.max(0, idx - 60);
        var end   = Math.min(text.length, idx + 160);
        return (start > 0 ? '… ' : '') + text.slice(start, end) + (end < text.length ? ' …' : '');
    }

    // ── Hours display ─────────────────────────────────────────────

    function syncHours() {
        if (!navTimedisp || !timedisp) return;
        var text = timedisp.textContent.trim();
        if (text && text !== 'Hours') {
            navTimedisp.textContent = text;
        }
    }

    // Copy hours into nav panel when it becomes available
    if (timedisp && navTimedisp) {
        var hoursObserver = new MutationObserver(syncHours);
        hoursObserver.observe(timedisp, { childList: true, subtree: true, characterData: true });
    }

    // ── Bootstrap collapse events ─────────────────────────────────

    // Remember which trigger (hamburger or search icon) opened the menu,
    // so closing it can return focus to that same control.
    navTriggers.forEach(function (trigger) {
        trigger.addEventListener('click', function () {
            lastTrigger = trigger;
        });
    });

    if (mainNavMenu) {
        // Focus the search input when the menu finishes opening
        mainNavMenu.addEventListener('shown.bs.collapse', function () {
            syncHours();
            if (navSearchInput) navSearchInput.focus();
        });

        // Clear search and return focus to whichever trigger opened the menu
        mainNavMenu.addEventListener('hidden.bs.collapse', function () {
            if (navSearchInput) navSearchInput.value = '';
            showColumns();
            if (lastTrigger) lastTrigger.focus();
        });
    }

    // ── Keyboard: Escape closes the menu ─────────────────────────

    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (!mainNavMenu || !mainNavMenu.classList.contains('show')) return;
        // If focus is inside the search input, Escape clears search first
        if (document.activeElement === navSearchInput && navSearchInput.value) {
            navSearchInput.value = '';
            showColumns();
            return;
        }
        if (typeof bootstrap !== 'undefined' && bootstrap.Collapse) {
            var collapseInstance = bootstrap.Collapse.getInstance(mainNavMenu);
            if (collapseInstance) collapseInstance.hide();
        }
    });

    // ── Flexsearch site search ────────────────────────────────────

    var searchIndex       = null;
    var searchDocs        = {};
    var searchReady       = false;
    var searchPromise     = null;
    var searchDataUrl     = '{{ "/assets/main-web/site-search.json" | relative_url }}';
    var minSearchChars    = 2;
    var searchDebounceMs  = 120;
    var searchFieldLimit  = 20;
    var pageSearchForm    = document.getElementById('page-search-form');
    var pageSearchInput   = document.getElementById('page-search-input');
    var pageSearchResults = document.getElementById('page-search-results');
    var pageSearchStatus  = document.getElementById('page-search-status');

    function debounce(fn, wait) {
        var timeoutId = null;
        return function () {
            var ctx = this;
            var args = arguments;
            clearTimeout(timeoutId);
            timeoutId = setTimeout(function () {
                fn.apply(ctx, args);
            }, wait);
        };
    }

    function ensureSearchIndex() {
        if (searchPromise) return searchPromise;

        searchIndex = new FlexSearch.Document({
            document: {
                id: 'id',
                store: false,
                index: [
                    { field: 'title', tokenize: 'forward' },
                    { field: 'content', tokenize: 'forward' },
                    { field: 'tags', tokenize: 'forward' }
                ]
            },
            cache: true
        });

        searchPromise = fetch(searchDataUrl)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!Array.isArray(data)) {
                    throw new Error('Search data must be an array of records.');
                }

                data.forEach(function (record) {
                    var id = Number(record.id);
                    if (!Number.isFinite(id)) return;

                    searchIndex.add({
                        id: id,
                        title: record.title || '',
                        content: record.content || '',
                        tags: Array.isArray(record.tags) ? record.tags.join(' ') : ''
                    });
                    searchDocs[id] = record;
                });
                searchReady = true;

                if (navSearchInput && navSearchInput.value.trim()) {
                    runNavSearch(navSearchInput.value.trim());
                }
                if (pageSearchInput && pageSearchInput.value.trim()) {
                    runPageSearch(pageSearchInput.value.trim());
                }
            })
            .catch(function (err) {
                console.warn('Library search data could not be loaded.', err);
                searchReady = false;
            });

        return searchPromise;
    }

    function getSearchIds(query) {
        if (!searchReady || !query) return [];

        var fieldBoost = {
            title: 8,
            tags: 5,
            content: 1
        };
        var fieldHits = {
            title: searchIndex.search(query, { field: 'title', limit: searchFieldLimit }),
            tags: searchIndex.search(query, { field: 'tags', limit: searchFieldLimit }),
            content: searchIndex.search(query, { field: 'content', limit: searchFieldLimit })
        };
        var scores = {};

        Object.keys(fieldHits).forEach(function (field) {
            var groups = fieldHits[field] || [];
            var boost = fieldBoost[field] || 1;

            groups.forEach(function (group) {
                (group.result || []).forEach(function (id, rank) {
                    var key = String(id);
                    // Higher-ranked matches in stronger fields receive more weight.
                    var rankScore = (searchFieldLimit - rank) * boost;
                    scores[key] = (scores[key] || 0) + rankScore;
                });
            });
        });

        return Object.keys(scores)
            .sort(function (a, b) {
                var scoreDiff = scores[b] - scores[a];
                if (scoreDiff !== 0) return scoreDiff;
                return Number(a) - Number(b);
            })
            .map(function (id) { return Number(id); });
    }

    function buildSearchResultList(ids, query, compact) {
        var html = compact ? '<ul class="list-unstyled mb-0">' : '<div class="list-group">';

        ids.slice(0, 10).forEach(function (id) {
            var doc = searchDocs[id];
            if (!doc) return;

            var snippet = getSnippet(doc.content, query);
            var linkClass = compact
                ? 'd-block text-dark text-decoration-none px-1 py-2 nav-search-result-link'
                : 'list-group-item list-group-item-action py-3';

            html += compact ? '<li>' : '';
            html += '<a class="' + linkClass + '" href="' + escapeAttr(doc.url || '#') + '">';
            html += '<div class="fw-semibold">' + highlight(doc.title || '', query) + '</div>';

            if (doc.page) {
                html += '<div class="small text-muted">' + escapeHtml(doc.page) + '</div>';
            }

            if (Array.isArray(doc.tags) && doc.tags.length) {
                html += '<div class="' + (compact ? 'mt-1' : 'mt-2') + ' d-flex flex-wrap gap-1">';
                doc.tags.slice(0, 5).forEach(function (tag) {
                    html += '<span class="badge rounded-pill text-bg-light border text-muted">' + escapeHtml(tag) + '</span>';
                });
                html += '</div>';
            }

            if (snippet) {
                html += '<div class="small text-muted mt-1">' + highlight(snippet, query) + '</div>';
            }

            html += '</a>';
            html += compact ? '</li>' : '';
        });

        html += compact ? '</ul>' : '</div>';
        return html;
    }

    function runNavSearch(query) {
        if (!navSearchResults) return;
        if (!query) { showColumns(); return; }
        if (query.length < minSearchChars) { showColumns(); return; }

        showResults();

        if (!searchReady) {
            navSearchResults.innerHTML = '<p class="text-muted px-1 py-2">Loading search…</p>';
            return;
        }

        var ids = getSearchIds(query);

        if (!ids.length) {
            navSearchResults.innerHTML =
                '<p class="text-muted px-1 py-2">No results found for <strong>' +
                escapeHtml(query) + '</strong>.</p>';
            return;
        }

        navSearchResults.innerHTML = buildSearchResultList(ids, query, true);
    }

    function renderPageSearchEmpty() {
        if (!pageSearchResults) return;

        pageSearchStatus.textContent = 'Type a few words to search the library website.';
        pageSearchResults.innerHTML =
            '<div class="border rounded-3 bg-light p-4 text-muted">Results will appear here as soon as you search.</div>';
    }

    function runPageSearch(query) {
        if (!pageSearchResults) return;

        if (!query) {
            renderPageSearchEmpty();
            return;
        }

        if (query.length < minSearchChars) {
            pageSearchStatus.textContent = 'Type at least ' + minSearchChars + ' characters to search.';
            pageSearchResults.innerHTML =
                '<div class="border rounded-3 bg-light p-4 text-muted">Keep typing to see search results.</div>';
            return;
        }

        if (!searchReady) {
            pageSearchStatus.textContent = 'Loading search index…';
            pageSearchResults.innerHTML = '<p class="text-muted py-3 mb-0">Loading search…</p>';
            return;
        }

        var ids = getSearchIds(query);

        if (!ids.length) {
            pageSearchStatus.textContent = 'No results found for "' + query + '".';
            pageSearchResults.innerHTML =
                '<div class="border rounded-3 bg-light p-4">' +
                '<p class="mb-0 text-muted">No results found for <strong>' + escapeHtml(query) + '</strong>.</p>' +
                '</div>';
            return;
        }

        pageSearchStatus.textContent = 'Showing ' + Math.min(ids.length, 10) + ' of ' + ids.length + ' results for "' + query + '".';
        pageSearchResults.innerHTML = buildSearchResultList(ids, query, false);
    }

    function getInitialPageQuery() {
        if (!window.URLSearchParams) return '';
        return new URLSearchParams(window.location.search).get('q') || '';
    }

    function showResults() {
        if (navSearchResults) navSearchResults.classList.remove('d-none');
        if (navMenuColumns)   navMenuColumns.classList.add('d-none');
    }

    function showColumns() {
        if (navSearchResults) {
            navSearchResults.classList.add('d-none');
            navSearchResults.innerHTML = '';
        }
        if (navMenuColumns) navMenuColumns.classList.remove('d-none');
    }

    // Lazy-init FlexSearch the first time the menu opens or the search page loads
    if (mainNavMenu) {
        mainNavMenu.addEventListener('show.bs.collapse', function () {
            ensureSearchIndex();
        });
    }

    // Live search as the user types
    if (navSearchInput) {
        var debouncedNavSearch = debounce(function () {
            runNavSearch(this.value.trim());
        }, searchDebounceMs);

        navSearchInput.addEventListener('input', debouncedNavSearch);
    }

    if (pageSearchInput) {
        var initialQuery = getInitialPageQuery();
        if (initialQuery) {
            pageSearchInput.value = initialQuery;
            runPageSearch(initialQuery);
        } else {
            renderPageSearchEmpty();
        }

        var debouncedPageSearch = debounce(function () {
            runPageSearch(this.value.trim());
        }, searchDebounceMs);

        pageSearchInput.addEventListener('input', debouncedPageSearch);
    }

    if (pageSearchForm) {
        pageSearchForm.addEventListener('submit', function () {
            if (pageSearchInput) {
                runPageSearch(pageSearchInput.value.trim());
            }
        });
    }

    if (pageSearchInput || pageSearchResults) {
        ensureSearchIndex();
    }

}());
</script>
