# =====================================================================
# Zones — single source of truth for room categorization.
# Referenced by rooms.csv via the `zone` column.
# Colors are pulled from the U of I brand book (or supplemented when no
# brand color is specified for a category).
# =====================================================================
# Each zone has:
#   key:          short identifier used in rooms.csv (lowercase, no spaces)
#   label:        human-readable name shown in the legend and zone tags
#   color:        hex value used for SVG fill and CSS swatches
#   brand_name:   the U of I brand color name (if applicable)
#   description:  internal note about what belongs in this zone
# =====================================================================

service:
  label: "Service Points (Staff Areas)"
  color: "#034441"
  brand_name: "Palouse"
  description: >
    Staffed service points (Circulation, Interlibrary Loan, CDIL, Research
    Computing and Data Services, Boise Cascade Assistive Technology Room).

resources:
  label: "Resources and Services"
  color: "#F1B300"
  brand_name: "Pride Gold"
  description: >
    Patron-facing resource and support spaces (Studio, Computer Labs, ITS
    Help Desk, Data Hub, Mill, Research Help Desk, Vandal Drop-In Tutoring,
    Writing Center, Reference Collection). Merges the former `service` and
    `resources` zones.

study:
  label: "Instruction/Study Areas"
  color: "#008080"
  brand_name: "Clearwater"
  description: >
    Group- and individual-focused study and instruction spaces (Living
    Room, Fishbowl, Group Study Rooms/Areas, Instruction Rooms, Individual
    Study). Merges the former `collab` and `individual` zones.

books:
  label: "Books"
  color: "#808080"
  brand_name: null
  description: >
    Main book stacks organized by Library of Congress call numbers,
    oversize books, and the primary monograph collection.

lendable:
  label: "Other Lendable Items"
  color: "#D7003F"
  brand_name: "Raspberry"
  description: >
    Other circulating media (DVDs, LPs, CDs/CD-ROMs) not covered by the
    Books zone. New zone — did not exist prior to the Illustrator redesign.

periodicals:
  label: "Periodicals"
  color: "#552301"
  brand_name: "Bark"
  description: >
    Bound print periodicals, current periodicals, newspapers, microforms,
    and similar serial collections.

restrooms:
  label: "Restrooms"
  color: "#5E48FF"
  brand_name: "Lupine"
  description: >
    Restroom facilities. All listed restrooms on a floor are treated as
    one navigation target in the UI.

nonpublic:
  label: "Staff Only Areas"
  color: "#323232"
  brand_name: null
  description: >
    Back-of-house, staff-only spaces (mail rooms, staff lounges, facilities
    closets, admin/faculty offices, conference rooms). Merges the former
    `nonpublic` and `admin` zones.

# =====================================================================
# rooms.csv `idle_zone` column
# Optional. When set, a room's SVG shape displays THIS zone's color while
# idle (unselected) instead of its own `zone` color — its own `zone` still
# governs its legend/room-list/detail-panel badge, and its own color takes
# over the moment it's selected. Two uses:
#   - a real zone key (e.g. `study`): the shape blends into a surrounding
#     zone by default (e.g. Board Games/Graphic Novels/New Books/Current
#     Periodicals blending into the teal Living Room) and reveals its true
#     zone color only on selection.
#   - the literal value `transparent`: the shape has no fill at all until
#     selected (e.g. Group Study Area, The Fishbowl) — handled by a fixed
#     CSS rule, not a generated `--zone-*` custom property.
# =====================================================================
